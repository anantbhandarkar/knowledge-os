[project]
name = "knowledge-os"
version = "0.1.0"
description = "The retrieval-first knowledge engine that refuses to hallucinate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "The Knowledge OS Authors" }]
keywords = ["rag", "retrieval", "llm", "langgraph", "pgvector", "citations", "enterprise"]

dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.9", "httpx>=0.27"]
# api mode (real providers) — install when KOS_MODE=api
api = ["anthropic>=0.25", "openai>=1.30", "cohere>=5", "psycopg[binary]>=3.1", "psycopg-pool>=3.2", "pgvector>=0.2"]

[project.urls]
Homepage = "https://github.com/anantbhandarkar/knowledge-os"
Documentation = "https://github.com/anantbhandarkar/knowledge-os/blob/main/docs/ARCHITECTURE.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
